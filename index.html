<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Exercise 39 js dugsiiye Mentorship</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="video">
        <div class="video-player-container">
            <div class="video-holder">
                <video src="https://assets.mixkit.co/active_storage/video_items/100223/1721860447/100223-video-720.mp4" id="video-player"></video>
                <div class="video-content">
                    <h2 class="video-title">Video Title</h2>
                    <span class="video-description">Video Description</span>
                </div>
            </div>
            <div class="progress-container">
                <input type="range" name="progress" id="progress" min="0" max="30" step="0.1" class="progress" value="0">
            </div>

            <div class="time-container">
                <span id="current-time">0:00</span>
                <span>/</span>
                <span id="duration">0:00</span>
            </div>
            <div class="controls">
                <div class="center">
                    <button id="previous">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="play">
                         <i class="fa-solid fa-pause"></i>
                    </button>
                    <button id="next">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>
                <i class="fa-solid fa-expand" id="expand"></i>
            </div>
            <div class="additional-control">
                <div class="audio-control">
                    <i class="fa-solid fa-volume-low"></i>
                    <input type="range" value="0" max="1" min="0" step="0.1" id="volume-range">
                </div>
                <div class="speed-control">
                    <i class="fa-solid fa-gauge-high"></i>
                    <select name="speed" id="speed-select">
                        <option value="0.5">0.5 </option>
                        <option value="1">1x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                        <option value="2.5">2.5x</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
